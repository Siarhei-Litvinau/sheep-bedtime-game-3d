<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Овцы перед сном — обложка</title>
  <defs>
    <linearGradient id="terminator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b1c30" stop-opacity="0" />
      <stop offset="50%" stop-color="#3a2620" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#e0895a" stop-opacity="0" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="630" /></clipPath>
    <!-- широкая пологая дуга: пик ~y=380 по центру, края ~y=460 -->
    <clipPath id="planetClip"><circle cx="600" cy="2200" r="1850" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ночное небо -->
    <rect width="1200" height="630" fill="#0b0916" />

    <!-- звёзды -->
    <g fill="#f2e6cf">
      <circle cx="120" cy="180" r="2.6" opacity="0.85" />
      <circle cx="200" cy="240" r="1.8" opacity="0.6" />
      <circle cx="80" cy="300" r="2.1" opacity="0.7" />
      <circle cx="300" cy="150" r="1.6" opacity="0.5" />
      <circle cx="60" cy="230" r="2.3" opacity="0.75" />
      <circle cx="250" cy="330" r="1.7" opacity="0.55" />
      <circle cx="150" cy="330" r="1.6" opacity="0.5" />
      <circle cx="1080" cy="200" r="2.4" opacity="0.7" />
      <circle cx="1140" cy="150" r="1.8" opacity="0.55" />
      <circle cx="1020" cy="300" r="2" opacity="0.6" />
    </g>

    <!-- заголовок — в чистом тёмном небе, без пересечения с горизонтом -->
    <text x="600" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f2e6d8" font-weight="600">Овцы перед сном</text>

    <!-- облака -->
    <g fill="#f5ecdd" opacity="0.9">
      <ellipse cx="920" cy="185" rx="66" ry="24" />
      <ellipse cx="966" cy="174" rx="42" ry="18" />
      <ellipse cx="882" cy="176" rx="38" ry="16" />
    </g>
    <g fill="#cdb9a6" opacity="0.85">
      <ellipse cx="210" cy="180" rx="52" ry="19" />
      <ellipse cx="248" cy="170" rx="34" ry="15" />
    </g>

    <!-- планета-горизонт: тёплая половина справа, холодная — слева (раздел 6) -->
    <circle cx="600" cy="2200" r="1850" fill="#e0895a" />
    <rect x="0" y="0" width="600" height="630" clip-path="url(#planetClip)" fill="#1b1c30" />
    <rect x="520" y="0" width="160" height="630" clip-path="url(#planetClip)" fill="url(#terminator)" />

    <!-- деревья -->
    <g fill="#22392f">
      <polygon points="115,430 138,368 161,430" />
      <polygon points="430,410 450,362 470,410" />
    </g>
    <g fill="#5c6b3f">
      <polygon points="900,412 924,358 948,412" />
      <polygon points="1050,438 1074,382 1098,438" />
    </g>

    <!-- забор вдоль горизонта -->
    <g stroke="#241a12" stroke-linecap="round">
      <line x1="60" y1="452" x2="1140" y2="452" stroke-width="9" />
      <line x1="60" y1="488" x2="1140" y2="488" stroke-width="9" />
      <line x1="95" y1="418" x2="95" y2="512" stroke-width="9" />
      <line x1="230" y1="410" x2="230" y2="504" stroke-width="9" />
      <line x1="365" y1="404" x2="365" y2="498" stroke-width="9" />
      <line x1="500" y1="400" x2="500" y2="494" stroke-width="9" />
      <line x1="635" y1="400" x2="635" y2="494" stroke-width="9" />
      <line x1="770" y1="403" x2="770" y2="497" stroke-width="9" />
      <line x1="905" y1="408" x2="905" y2="502" stroke-width="9" />
      <line x1="1040" y1="416" x2="1040" y2="510" stroke-width="9" />
      <line x1="1105" y1="422" x2="1105" y2="516" stroke-width="9" />
    </g>

    <!-- амбар (тёмная сторона) -->
    <g transform="translate(150,300)">
      <polygon points="0,60 70,0 140,60" fill="#3a2620" />
      <rect x="10" y="60" width="120" height="88" fill="#5c3a30" />
      <rect x="55" y="110" width="30" height="38" fill="#281a14" />
      <rect x="24" y="76" width="18" height="18" fill="#ffcf8e" />
      <rect x="98" y="76" width="18" height="18" fill="#ffcf8e" />
      <rect x="24" y="100" width="18" height="18" fill="#1c130d" />
      <rect x="98" y="100" width="18" height="18" fill="#1c130d" />
    </g>

    <!-- отара на светлой стороне: тело+голова, как у прыгающей овцы, с интервалом -->
    <g>
      <ellipse cx="810" cy="512" rx="44" ry="32" fill="#e8ddc8" />
      <circle cx="772" cy="492" r="19" fill="#3c332c" />
    </g>
    <g>
      <ellipse cx="905" cy="522" rx="44" ry="32" fill="#e8ddc8" />
      <circle cx="867" cy="502" r="19" fill="#3c332c" />
    </g>
    <g>
      <ellipse cx="1000" cy="510" rx="44" ry="32" fill="#e8ddc8" />
      <circle cx="962" cy="490" r="19" fill="#3c332c" />
    </g>

    <!-- одна овца в прыжке над забором, на границе день/ночь -->
    <g>
      <ellipse cx="640" cy="452" rx="46" ry="34" fill="#e8ddc8" />
      <circle cx="600" cy="432" r="21" fill="#3c332c" />
    </g>
  </g>
</svg>
